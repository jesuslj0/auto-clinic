{% comment %}
Los iconos de «Mi cuenta», en un solo sitio.

Existe para que la pestaña y el título de su tarjeta lleven **el mismo trazo**:
si el dibujo viviera suelto en cada plantilla, cambiar uno dejaría al otro
descolgado. Pinta solo el `<svg>`; el envoltorio —el chip redondeado del título o
nada, en la pestaña— lo pone quien lo incluye.

    {% templatetag openblock %} include 'core/_account_icon.html' with icon='cuenta' icon_class='h-4 w-4' {% templatetag closeblock %}

Claves: `cuenta` (tarjeta identificativa, la pestaña y sus datos de acceso),
`password` (candado), `perfil` (maletín) y `horario` (calendario). Trazos de
Heroicons a 1.75, como la navegación lateral (`partials/_section_icon.html`).
{% endcomment %}
