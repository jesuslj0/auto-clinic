{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-canvas">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon/favicon-16x16.png' %}">
    <title>Error del servidor · Auto Clinic</title>
    {% include "partials/_head_theme.html" %}
</head>
<body class="h-full text-content antialiased">
<div class="flex min-h-full flex-col items-center justify-center px-4 py-16">
    <div class="w-full max-w-md rounded-3xl bg-surface p-10 text-center shadow-soft ring-1 ring-line">
        <span class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-danger-soft">
            <svg class="h-8 w-8 text-danger" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </span>
        <p class="mt-5 text-sm font-semibold uppercase tracking-wide text-danger">Error 500</p>
        <h1 class="mt-2 text-2xl font-semibold text-content">Error interno del servidor</h1>
        <p class="mt-3 text-sm leading-6 text-content-subtle">
            Algo ha ido mal en nuestro lado. El equipo ha sido notificado. Inténtalo de nuevo en unos minutos.
        </p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a href="/" class="inline-flex items-center justify-center rounded-2xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700">
                Ir al panel
            </a>
            <button onclick="location.reload()" class="inline-flex items-center justify-center rounded-2xl border border-line px-5 py-2.5 text-sm font-semibold text-content-muted transition hover:bg-muted">
                Reintentar
            </button>
        </div>
    </div>
</div>
</body>
</html>
