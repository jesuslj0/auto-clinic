{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-canvas">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon/favicon-16x16.png' %}">
    <title>Página no encontrada · Auto Clinic</title>
    {% include "partials/_head_theme.html" %}
</head>
<body class="h-full text-content antialiased">
<div class="flex min-h-full flex-col items-center justify-center px-4 py-16">
    <div class="w-full max-w-md rounded-3xl bg-surface p-10 text-center shadow-soft ring-1 ring-line">
        <span class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-soft">
            <svg class="h-8 w-8 text-brand-fg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
            </svg>
        </span>
        <p class="mt-5 text-sm font-semibold uppercase tracking-wide text-brand-fg">Error 404</p>
        <h1 class="mt-2 text-2xl font-semibold text-content">Página no encontrada</h1>
        <p class="mt-3 text-sm leading-6 text-content-subtle">
            La dirección que buscas no existe o ha sido movida. Comprueba la URL o vuelve al inicio.
        </p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a href="/" class="inline-flex items-center justify-center rounded-2xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700">
                Ir al panel
            </a>
            <button onclick="history.back()" class="inline-flex items-center justify-center rounded-2xl border border-line px-5 py-2.5 text-sm font-semibold text-content-muted transition hover:bg-muted">
                Volver atrás
            </button>
        </div>
    </div>
</div>
</body>
</html>
