
<section class="border-t border-line pt-7" data-formset="{{ formset.prefix }}">
    <div class="mb-4 flex items-start justify-between gap-4">
        <div>
            <h3 class="text-base font-semibold text-content">{{ title }}</h3>
            <p class="mt-0.5 text-sm text-content-subtle">{{ subtitle }}</p>
        </div>
        <button type="button" data-formset-add
            class="inline-flex flex-shrink-0 items-center gap-1.5 rounded-xl bg-brand-soft px-3 py-2 text-sm font-semibold text-brand-fg transition hover:bg-brand-soft-strong">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            {{ add_label }}
        </button>
    </div>

    {{ formset.management_form }}

    {% for error in formset.non_form_errors %}
    <div class="mb-3 rounded-xl bg-danger-soft px-4 py-3 ring-1 ring-danger-line">
        <p class="text-sm text-danger">{{ error }}</p>
    </div>
    {% endfor %}

    <div data-formset-rows class="space-y-3">
        {% for form in formset %}
            {% include row_partial %}
        {% endfor %}
    </div>

    <p data-formset-empty-hint class="mt-3 text-sm text-content-faint {% if formset.forms %}hidden{% endif %}">
        {{ empty_label }}
    </p>

    {# Plantilla para clonar una fila nueva. `__prefix__` se sustituye por el índice. #}
    <template data-formset-empty>
        {% include row_partial with form=formset.empty_form %}
    </template>
</section>
