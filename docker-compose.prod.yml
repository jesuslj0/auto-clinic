services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/jesuslj0/auto-clinic:prod
    pull_policy: always
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate --noinput &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import os, sys, urllib.request;
          host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip();
          req = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host});
          sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      AGENT_MASTER_API_KEY: ${AGENT_MASTER_API_KEY}
      AGENT_ERRORS_API_KEY: ${AGENT_ERRORS_API_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      CLINICAL_MEDIA_URL_EXPIRE: ${CLINICAL_MEDIA_URL_EXPIRE:-600}
      CHAT_MEDIA_URL_EXPIRE: ${CHAT_MEDIA_URL_EXPIRE:-300}
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ghcr.io/jesuslj0/auto-clinic-nginx:prod
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - media_files:/app/media:ro
    networks:
      - coolify
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.autoclinic-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.autoclinic-web.entrypoints=https
      - traefik.http.routers.autoclinic-web.tls=true
      - traefik.http.routers.autoclinic-web.tls.certresolver=letsencrypt
      - traefik.http.services.autoclinic-web.loadbalancer.server.port=80
    depends_on:
      web:
        condition: service_healthy

  celery:
    image: ghcr.io/jesuslj0/auto-clinic:prod
    pull_policy: always
    restart: unless-stopped
    command: celery -A config worker -l info
    healthcheck:
      # `inspect ping` va y vuelve por el broker, así que detecta el fallo real
      # de un worker: proceso vivo pero desconectado de Redis.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 5 > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/jesuslj0/auto-clinic:prod
    pull_policy: always
    restart: unless-stopped
    command: celery -A config beat -l info
    healthcheck:
      # beat no atiende consultas, pero reescribe su fichero de estado cada
      # 180 s (celery.beat.Scheduler.sync_every). Si lleva 15 minutos sin
      # tocarlo está colgado, aunque el proceso siga en pie.
      test:
        - CMD-SHELL
        - >
          python -c "import glob, os, sys, time;
          f = glob.glob('/app/celerybeat-schedule*');
          sys.exit(0 if f and time.time() - max(os.path.getmtime(x) for x in f) < 900 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  media_files:
