services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # Única imagen del proyecto: celery y celery-beat la reutilizan en lugar de
    # construir la suya. Sin esto, cada despliegue construía el mismo Dockerfile
    # tres veces.
    build: .
    image: auto-clinic:latest
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate --noinput &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      # El Host se toma de ALLOWED_HOSTS porque Django rechaza con 400 cualquier
      # cabecera que no esté en la lista, y 127.0.0.1 no lo está en producción.
      test:
        - CMD-SHELL
        - >
          python -c "import os, sys, urllib.request;
          host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip();
          req = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host});
          sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # Margen para que corran las migraciones antes de empezar a contar fallos
      start_period: 90s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      AGENT_MASTER_API_KEY: ${AGENT_MASTER_API_KEY}
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - media_files:/app/media:ro
    networks:
      - coolify
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.autoclinic-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.autoclinic-web.entrypoints=https
      - traefik.http.routers.autoclinic-web.tls=true
      - traefik.http.routers.autoclinic-web.tls.certresolver=letsencrypt
      - traefik.http.services.autoclinic-web.loadbalancer.server.port=80
    depends_on:
      # service_healthy y no service_started: si nginx abre antes de que las
      # migraciones terminen, Traefik enruta tráfico a un backend que devuelve 502.
      web:
        condition: service_healthy

  celery:
    # Reutiliza la imagen que construye `web`; sin `build` para no repetirla.
    image: auto-clinic:latest
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: auto-clinic:latest
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  media_files:
